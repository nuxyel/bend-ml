<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 318" width="900" height="318" role="img" aria-label="MNIST: one training epoch (784-128-10 MLP)">
<title>MNIST: one training epoch (784-128-10 MLP)</title>
<rect x="0.5" y="0.5" width="899" height="317" rx="16" fill="#121820" stroke="#2a3441"/>
<text x="28" y="40" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e6edf3">MNIST: one training epoch (784-128-10 MLP)</text>
<text x="28" y="64" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b98a8">Same data, same initial weights, same batches: identical loss and hits in Bend and PyTorch</text>
<text x="28" y="110" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Bend v1 (lists)</text><rect x="250" y="92" width="530.0" height="26" rx="6" fill="#ff6b6b"/><text x="790.0" y="111" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#ff6b6b">544 s</text><text x="28" y="162" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Bend v2 (flat Array, typed)</text><rect x="250" y="144" width="273.9" height="26" rx="6" fill="#5aa9ff"/><text x="533.9" y="163" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#5aa9ff">7.0 s</text><text x="28" y="214" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">PyTorch (16 threads, CPU)</text><rect x="250" y="196" width="64.6" height="26" rx="6" fill="#3ddc84"/><text x="324.6" y="215" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#3ddc84">0.2 s</text><text x="872" y="266" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a8">log scale</text><text x="28" y="296" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f0b429">v1 → v2: 78x faster. PyTorch is still ~25–35x ahead.</text>
</svg>
