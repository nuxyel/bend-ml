<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" role="img" aria-label="What moved the needle (and what did not)">
<title>What moved the needle (and what did not)</title>
<rect x="0.5" y="0.5" width="959" height="391" rx="16" fill="#121820" stroke="#2a3441"/>
<text x="28" y="40" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e6edf3">What moved the needle (and what did not)</text>
<text x="28" y="64" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b98a8">Effect of each change on run time, measured on this machine</text>
<line x1="590" y1="80" x2="590" y2="334" stroke="#8b98a8" stroke-width="1" stroke-dasharray="3 4"/><text x="596" y="348" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a8">same speed (1x)</text><text x="28" y="110" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Lists → flat Array (1 thread)</text><rect x="590.0" y="92" width="218.6" height="26" rx="6" fill="#3ddc84"/><text x="818.6" y="111" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#3ddc84">49x faster</text><text x="28" y="160" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Parallel row blocks (MNIST product)</text><rect x="590.0" y="142" width="33.0" height="26" rx="6" fill="#3ddc84"/><text x="633.0" y="161" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#3ddc84">1.8x faster</text><text x="28" y="210" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">GPU, compute-bound flat loop</text><rect x="590.0" y="192" width="75.0" height="26" rx="6" fill="#3ddc84"/><text x="675.0" y="211" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#3ddc84">3.8x faster</text><text x="28" y="260" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">GPU, our memory-bound kernels</text><rect x="528.3" y="242" width="61.7" height="26" rx="6" fill="#ff6b6b"/><text x="518.3" y="261" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#ff6b6b">3–18x slower</text><text x="28" y="310" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Copying the matrix per task (matvec)</text><rect x="460.7" y="292" width="129.3" height="26" rx="6" fill="#ff6b6b"/><text x="450.7" y="311" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#ff6b6b">10x slower</text><text x="28" y="374" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f0b429">Measured, not guessed: each bar is an experiment in NOTES.md. Log scale; right is faster.</text>
</svg>
