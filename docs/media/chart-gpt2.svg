<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" role="img" aria-label="GPT-2 small (124 M): time per generated token">
<title>GPT-2 small (124 M): time per generated token</title>
<rect x="0.5" y="0.5" width="899" height="369" rx="16" fill="#121820" stroke="#2a3441"/>
<text x="28" y="40" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e6edf3">GPT-2 small (124 M): time per generated token</text>
<text x="28" y="64" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b98a8">Greedy decoding with a key/value cache; Bend generates the same tokens as PyTorch</text>
<text x="28" y="110" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Bend v1 (lists)</text><rect x="250" y="92" width="530.0" height="26" rx="6" fill="#ff6b6b"/><text x="790.0" y="111" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#ff6b6b">3.0 s</text><text x="28" y="162" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">Bend v2 (flat Array)</text><rect x="250" y="144" width="232.6" height="26" rx="6" fill="#5aa9ff"/><text x="492.6" y="163" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#5aa9ff">0.1 s</text><text x="28" y="214" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">PyTorch, 1 thread</text><rect x="250" y="196" width="180.3" height="26" rx="6" fill="#3ddc84"/><text x="440.3" y="215" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#3ddc84">55 ms</text><text x="28" y="266" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3">PyTorch, 16 threads</text><rect x="250" y="248" width="96.1" height="26" rx="6" fill="#3ddc84"/><text x="356.1" y="267" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#3ddc84">21 ms</text><text x="872" y="318" text-anchor="end" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b98a8">log scale; PyTorch time is one forward pass</text><text x="28" y="348" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f0b429">v1 → v2: 30x faster. PyTorch is still ~2–5x ahead.</text>
</svg>
